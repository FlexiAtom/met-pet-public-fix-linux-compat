# CI for MeaPet
#
# Runs lint, syntax check, and tests across supported Python versions.
# System dependencies are installed for PyQt5 / OpenGL on Linux.
# Dependencies are installed from pyproject.toml (no requirements.txt).

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      # Use .python-version (3.12) as the primary — it's listed first in the status
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (PyQt5 / OpenGL)
      run: |
        # 1. 清理本地 apt 缓存（解决缓存损坏导致的 exit code 100）
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
          
        # 2. 恢复官方源（本文件里已没有任何改源的 sed 步骤，这道兜底只是留着）
        # 走 https：明文源上 Release 的签名仍然验得过，但中间人喂旧索引（降版本/冻结
        # 快照）没人拦得住，且能看到这台机器在装什么。2026-10-22 现量：
        # https://archive.ubuntu.com/ubuntu/dists/noble/Release 与 security.ubuntu.com
        # 同一 URIs 均 HTTP 200、ssl_verify_result=0（TLS 1.3，leaf
        # CN=archive.ubuntu.com，issuer Let's Encrypt YR2）。
        sudo bash -c 'cat > /etc/apt/sources.list <<EOF
        deb https://archive.ubuntu.com/ubuntu $(lsb_release -cs) main restricted universe multiverse
        deb https://archive.ubuntu.com/ubuntu $(lsb_release -cs)-updates main restricted universe multiverse
        deb https://archive.ubuntu.com/ubuntu $(lsb_release -cs)-backports main restricted universe multiverse
        deb https://security.ubuntu.com/ubuntu $(lsb_release -cs)-security main restricted universe multiverse
        EOF'
          
        # 3. 更新源并安装依赖
        sudo apt-get update
        sudo apt-get install -y \
           libgl1 \
           mesa-common-dev \
           libosmesa6-dev \
            freeglut3-dev \
            libglu1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            xvfb


    - name: Install Python dependencies
      timeout-minutes: 10
      run: |
        python -m pip install --upgrade pip
        # Install core + linux extras (pins exact PyQt5 / Pillow versions for Linux)
        # numpy 由 [linux] extras 自己声明（pyproject.toml:92-93 两行 marker），这里不再
        # 重复钉一遍：从前那行 "numpy>=1.21,<2.0" 与同支里的 python_version >= '3.13'
        # 互相矛盾，正是 2026-10-21 从 VITS 清单撤掉的那颗钉子。
        # pytest/ruff are not runtime deps; install them explicitly for CI.
        pip install -e ".[linux]"
        pip install ruff pytest

    - name: Lint with ruff
      run: |
        python -m ruff check meapet wizard scripts tests

    - name: Syntax check with compileall
      run: |
        python -m compileall -q meapet wizard

    # Single pytest pass under Xvfb. The previous dual run
    # (plain pytest, then xvfb-run pytest --forked) doubled wall time and
    # the second pass was fragile: pytest-forked depends on legacy py.process
    # and interacts poorly with QApplication / async_runtime daemon state.
    # After the f1e443c test fixes, first-pass duration recovered (~70s) but
    # the job still failed here — consistent with forked/xvfb second pass.
    - name: Test with pytest (headless)
      timeout-minutes: 20
      env:
        PYTHONDEVMODE: "1"
        QT_QPA_PLATFORM: "offscreen"
      run: |
        export MAKEFLAGS="-j1"
        export QT_QPA_PLATFORM=offscreen
        # -ra: show skip/xfail reasons; --tb=short keeps logs readable in Actions
        xvfb-run -a python -X faulthandler -m pytest -q --tb=short

